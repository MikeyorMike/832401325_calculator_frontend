# Netlify 部署配置
#
# ⚠️ 重要：本文件里的路径全部是「相对于仓库根目录」的。
#    因此 Netlify 界面上的 **Base directory 必须留空**！
#    如果在界面把 Base directory 填成 src，Netlify 会拼接成 src/src，
#    构建直接失败（报错：Deploy directory 'src/src' does not exist）。
#
#    正确做法：界面 Base directory 留空，发布目录由本文件指定。

[build]
  # 前端源码在 src 子目录，且无需构建，因此发布目录就是 src
  # （相对仓库根目录，不要写成 src/src）
  publish = "src"
  # 纯静态项目，留空表示不执行构建命令
  command = ""

# 单页应用友好：任何找不到的路径都回退到 index.html
# 这样访问根路径 https://站点.netlify.app/ 一定能打开计算器
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 静态资源缓存策略：CSS/JS 变更后需要及时生效，因此设置较短的缓存时间
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
